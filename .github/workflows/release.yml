name: stick release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["release/*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run Tests
        run: go test -v ./...

      - name: Test version info (development build)
        run: |
          go build -o stick-test .
          echo "=== Testing version extraction ==="
          ./stick-test version
          ./stick-test version --json
          echo "=== Testing build info ==="
          ./stick-test buildinfo
          rm stick-test

  build:
    needs: test
    name: Build Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [amd64, arm64]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build Binary
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
        run: |
          # Set version variables from GitHub Actions environment
          VERSION=${{ github.ref_name }}
          COMMIT=${{ github.sha }}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Build with ldflags to embed version information
          go build -ldflags "-X main.BuildVersion=${VERSION} -X main.BuildCommit=${COMMIT::7} -X main.BuildDate=${DATE}" -o dist/stick-${{ matrix.platform }}-${{ matrix.arch }} .
          cd dist && ln -s stick-${{ matrix.platform }}-${{ matrix.arch }} stk-${{ matrix.platform }}-${{ matrix.arch }}

      - name: Test version info
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        run: |
          echo "=== Testing built binary version info ==="
          ./dist/stick-linux-amd64 version
          echo ""
          echo "=== Testing JSON output ==="
          ./dist/stick-linux-amd64 version --json
          echo ""
          echo "=== Testing short version ==="
          ./dist/stick-linux-amd64 version --short
          echo ""
          echo "=== Testing build info ==="
          ./dist/stick-linux-amd64 buildinfo
          echo ""
          echo "=== Testing stk alias ==="
          ./dist/stk-linux-amd64 version --short

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stick-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/stick-${{ matrix.platform }}-${{ matrix.arch }}
            dist/stk-${{ matrix.platform }}-${{ matrix.arch }}
          compression-level: 9
          retention-days: 5

  release:
    needs: build
    name: Create Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Test downloaded artifacts
        run: |
          cd artifacts
          echo "=== Downloaded files ==="
          ls -la
          echo ""
          echo "=== Testing Linux binary version ==="
          chmod +x stick-linux-amd64
          ./stick-linux-amd64 version
          echo ""
          echo "=== Verifying this is a release build ==="
          ./stick-linux-amd64 version --json | grep -E '"version"|"is_modified"'

      - name: Generate checksums
        run: |
          cd artifacts
          for file in stick-*; do
            if [ -f "$file" ]; then
              sha256sum "$file" >> ../checksums.txt
            fi
          done
          echo "=== Generated checksums ==="
          cat ../checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/stick-*
            artifacts/stk-*
            checksums.txt
          name: Release ${{ github.ref_name }}
          body_path: ${{ github.workspace }}/CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-summary:
    needs: [release]
    name: Release Summary
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Summary
        run: |
          VERSION=${{ github.ref_name }}
          echo "## 🎉 Release Summary for $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Completed Tasks:" >> $GITHUB_STEP_SUMMARY
          echo "- Built binaries for Linux and macOS (amd64 + arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- Tested BuildInfo version extraction" >> $GITHUB_STEP_SUMMARY
          echo "- Generated checksums" >> $GITHUB_STEP_SUMMARY
          echo "- Created GitHub release with artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Downloads:" >> $GITHUB_STEP_SUMMARY
          echo "- **Linux/Manual**: Download from [releases page](https://github.com/tesh254/stick/releases/tag/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- **Go install**: \`go install github.com/tesh254/stick@$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Version Info:" >> $GITHUB_STEP_SUMMARY
          echo "All binaries include automatic version detection via Go's BuildInfo system:" >> $GITHUB_STEP_SUMMARY
          echo "- \`stick version\` - Detailed version info" >> $GITHUB_STEP_SUMMARY
          echo "- \`stick version --json\` - JSON format" >> $GITHUB_STEP_SUMMARY
          echo "- \`stick buildinfo\` - Comprehensive build details" >> $GITHUB_STEP_SUMMARY
